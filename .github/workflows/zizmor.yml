name: zizmor

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, to catch newly published advisories for pinned actions
    - cron: "17 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows, actions and dependabot config
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repository to audit it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          collect: all
          persona: pedantic
          # Fail the job on findings instead of uploading SARIF
          advanced-security: false
