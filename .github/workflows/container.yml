name: Container image

on:
  push:
    tags: ['*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never abort a push halfway through
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify tag signature
    runs-on: ubuntu-latest
    permissions:
      contents: read # fetch the tag, list collaborators
    steps:
      - name: Fetch tag object
        # actions/checkout turns annotated tags into lightweight ones,
        # which drops the signature, so fetch the tag directly
        run: |
          git init --quiet .
          git fetch --quiet --depth=1 \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${TAG}:refs/tags/${TAG}"
      - name: Check tag points at the pushed commit
        run: |
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "${commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${TAG} moved to ${commit}"
            exit 1
          fi
      - name: Verify signature by a maintainer or admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
            echo "::error::${TAG} is a lightweight tag and not signed"
            exit 1
          fi
          # Everyone with the maintain or admin role, including
          # access through the organisation
          mapfile -t signers < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/collaborators?affiliation=all" \
              --jq '.[]
                | select(.permissions.admin or .permissions.maintain)
                | .login'
          )
          if (( ${#signers[@]} == 0 )); then
            echo "::error::Found no maintainers or admins"
            exit 1
          fi
          # One keyring per person, so a valid signature tells us
          # whose key made it
          for login in "${signers[@]}"; do
            export GNUPGHOME="${RUNNER_TEMP}/gnupg-${login}"
            install -d -m 700 "${GNUPGHOME}"
            curl -fsSL "${GITHUB_SERVER_URL}/${login}.gpg" \
              | gpg --batch --quiet --import 2>/dev/null || true
            if git verify-tag "refs/tags/${TAG}" 2>/dev/null; then
              echo "${TAG} is signed by ${login}"
              exit 0
            fi
          done
          echo "::error::${TAG} is not signed by: ${signers[*]}"
          exit 1

  image:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Detect prerelease
        id: kind
        # SemVer: a hyphen after the version marks a prerelease,
        # e.g. 1.0.0-rc1
        run: |
          if [[ "${TAG}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Containerfile runs git archive on HEAD, so .git must
          # be present, but without the token in its config
          persist-credentials: false
      - name: Log in to registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${REGISTRY_TOKEN}" | docker login "${REGISTRY}" \
            --username "${REGISTRY_USER}" --password-stdin
      - name: Build image
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          docker build \
            --file Containerfile \
            --build-arg GIT_REF=HEAD \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${TAG}" \
            .
      - name: Push tag
        run: docker push "${IMAGE}:${TAG}"
      - name: Push latest
        # A prerelease must not become latest
        if: steps.kind.outputs.prerelease == 'false'
        run: |
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
      - name: Log out of registry
        if: always()
        run: docker logout "${REGISTRY}"

  release:
    name: Create release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - name: Create release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
        run: |
          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
